name: Build DELUXE PS4 PKG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Checking project structure"
          ls -la
          test -f Makefile

      - name: Build with official OpenOrbis toolchain
        run: |
          git clone --depth 1 --branch v0.5.4 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git \
            "$RUNNER_TEMP/OpenOrbis-PS4-Toolchain"
          echo "Toolchain source downloaded."
          echo "A project-specific build setup is still required."

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-build-diagnostics
          path: |
            Makefile
            src/
            sce_sys/
            .github/workflows/build.yml
          if-no-files-found: ignore

name: DELUXE - Diagnose OpenOrbis

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect project
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f | sort
          echo "=== Makefile ==="
          cat Makefile

      - name: Inspect OpenOrbis toolchain
        run: |
          git clone --depth 1 --branch v0.5.4 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git \
            "$RUNNER_TEMP/OpenOrbis-PS4-Toolchain"
          echo "=== Available build tools ==="
          find "$RUNNER_TEMP/OpenOrbis-PS4-Toolchain" \
            -type f \( -name 'clang' -o -name 'create-fself' \
            -o -name 'create-gp4' -o -name 'PkgTool.Core' \) -print
          echo "=== Toolchain README ==="
          sed -n '1,180p' \
            "$RUNNER_TEMP/OpenOrbis-PS4-Toolchain/README.md" || true

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-toolchain-diagnostics
          path: |
            Makefile
            src/
            sce_sys/
          if-no-files-found: ignore

name: Build PKG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (FTP client + UI, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc make python3 python3-pil
      - name: Run tests
        run: SHOT_OUT=screenshots make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

  build-pkg:
    name: Build PS4 PKG (OpenOrbis)
    needs: host-tests
    runs-on: ubuntu-22.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang/lld
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip
      - name: Download OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oo
          gh release view v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --json tagName,assets || {
            echo "::error::Could not find a release in OpenOrbis/OpenOrbis-PS4-Toolchain"
            exit 1
          }
          ASSET=$(gh release view v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --json assets --jq '.assets[].name' | grep -E 'toolchain-llvm-18.*\.tar\.gz$' | head -n 1 || true)
          test -n "$ASSET" || {
            echo "::error::No toolchain-llvm-18 tar.gz asset found"
            exit 1
          }
          gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "$ASSET" --dir /tmp/oo
          mkdir -p "$RUNNER_TEMP/OpenOrbisSDK"
          tar -xzf "/tmp/oo/$ASSET" -C "$RUNNER_TEMP/OpenOrbisSDK"
          TC=$(find "$RUNNER_TEMP/OpenOrbisSDK" -type f -name link.x -printf '%h\n' | head -n 1)
          test -n "$TC" || { echo "::error::Could not locate PS4Toolchain (link.x missing)"; find "$RUNNER_TEMP/OpenOrbisSDK" -maxdepth 4 -type d; exit 1; }
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "Using toolchain: $TC"

      - name: Diagnose OpenOrbis headers
        shell: bash
        run: |
          set -e
          echo "===== Toolchain ====="
          echo "$OO_PS4_TOOLCHAIN"
          echo "===== IPv4 and socket definitions ====="
          grep -R -n -E 'SockaddrIn|Sockaddr.*In|SOL_SOCKET|SO_SNDTIMEO|SO_RCVTIMEO|OrbisNetSockaddr|OrbisNetInAddr' "$OO_PS4_TOOLCHAIN/include/orbis" | head -100 || true
          echo "===== Notification definitions ====="
          grep -R -n -E 'OrbisNotificationRequest|sceKernelSendNotificationRequest' "$OO_PS4_TOOLCHAIN/include/orbis" | head -60 || true

      - name: Install OpenSSL compatibility libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libssl3 libssl-dev
          echo "===== Available OpenSSL libraries ====="
          ldconfig -p | grep -E 'libssl\.so|libcrypto\.so' || true

      - name: Diagnose PkgTool OpenSSL requirements
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          echo "===== PkgTool file type ====="
          file "$TOOL"
          echo "===== PkgTool runtime dependencies ====="
          ldd "$TOOL" || true
          echo "===== OpenSSL libraries ====="
          ldconfig -p | grep -E 'libssl|libcrypto' || true

      - name: Build + validate PKG
        run: make
      - name: Verify PKG file
        run: |
          set -e
          PKG=$(ls IV0000-*.pkg)
          ls -l "$PKG"
          test "$(head -c4 "$PKG" | xxd -p)" = "7f434e54" || { echo "::error::bad PKG magic"; exit 1; }
          echo "PKG magic OK"
      - uses: actions/upload-artifact@v4
        with:
          name: DELUXE-PKG-MANAGER-pkg
          path: |
            IV0000-*.pkg
            eboot.bin
            build/deluxe.elf
            build/deluxe.oelf
            pkg.gp4
            sce_sys/param.sfo
          if-no-files-found: warn


      - name: Upload PS4 diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-PS4-DIAGNOSTICS
          path: |
            eboot.bin
            build/deluxe.elf
            build/deluxe.oelf
            pkg.gp4
            sce_sys/param.sfo
          if-no-files-found: warn

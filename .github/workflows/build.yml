name: Build DELUXE PS4

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 curl tar make unzip

      - name: Download OpenOrbis release
        run: |
          set -eux
          sudo apt-get install -y jq
          API=https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest
          URL=$(curl -fsSL "$API" | jq -r '[.assets[] | select(.name | test("linux|ubuntu"; "i"))][0].browser_download_url // empty')
          if [ -z "$URL" ]; then
            echo "No Linux release asset found. Listing available assets:"
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi
          echo "Selected release asset: $URL"
          curl -fL "$URL" -o "$RUNNER_TEMP/openorbis-release"
          file "$RUNNER_TEMP/openorbis-release"
          echo "Downloaded release asset; inspect its format before extraction."

      - name: Build project
        run: |
          set -eux
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN/bin:$PATH"
          make

      - name: Upload package if created
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-PKG
          path: "*.pkg"
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-build-logs
          path: |
            build/
            pkg.gp4
            eboot.bin
          if-no-files-found: ignore

name: Build DELUXE PS4

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 curl tar make unzip

      - name: Install LLVM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo "CC=$(command -v clang-18)" >> "$GITHUB_ENV"
          clang-18 --version

      - name: Download OpenOrbis release
        shell: bash
        run: |
          set -eux
          API="https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest"
          URL=$(curl -fsSL "$API" | jq -r '.assets[] | select(.name == "toolchain-llvm-18.tar.gz") | .browser_download_url')
          test -n "$URL"
          curl -fL "$URL" -o "$RUNNER_TEMP/openorbis.tar.gz"
          mkdir -p "$RUNNER_TEMP/OpenOrbisSDK"
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/OpenOrbisSDK"
          SDK="$RUNNER_TEMP/OpenOrbisSDK/OpenOrbis/PS4Toolchain"
          test -x "$SDK/bin/linux/create-fself"
          test -x "$SDK/bin/linux/create-gp4"
          test -f "$SDK/bin/linux/PkgTool.Core"
          chmod +x "$SDK/bin/linux/"*
          echo "OO_PS4_TOOLCHAIN=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin/linux" >> "$GITHUB_PATH"
          echo "=== Find clang in SDK archive ==="
          find "$RUNNER_TEMP/OpenOrbisSDK" -type f -name clang -print
          echo "=== System clang ==="
          command -v clang || true
          echo "=== OpenOrbis tools ==="
          ls -lah "$SDK/bin/linux"
          echo "=== SDK folders ==="
          ls -ld "$SDK/include" "$SDK/lib"

      - name: Build project
        run: |
          set -eux
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$OO_PS4_TOOLCHAIN/bin:$PATH"
          make

      - name: Upload package if created
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-PKG
          path: "*.pkg"
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DELUXE-build-logs
          path: |
            build/
            pkg.gp4
            eboot.bin
          if-no-files-found: ignore

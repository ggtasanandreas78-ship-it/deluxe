name: Build PKG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (FTP client + UI, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc make python3 python3-pil
      - name: Run tests
        run: SHOT_OUT=screenshots make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

  build-pkg:
    name: Build PS4 PKG (OpenOrbis)
    needs: host-tests
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang/lld
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip
      - name: Download OpenOrbis toolchain (latest release)
        run: |
          set -e
          gh release view --repo OpenOrbis/PS4Toolchain-PS4-Toolchain --json tagName,assets \
            --jq '.tagName, (.assets[].name)'
          # pick the first non-Windows/macOS archive; adjust the pattern if the asset names change
          ASSET=$(gh release view --repo OpenOrbis/PS4Toolchain-PS4-Toolchain --json assets \
            --jq '[.assets[].name | select(test("(?i)(tar\\.gz|tgz|zip)$")) | select(test("(?i)win|mac|osx|docker")|not)][0]')
          test -n "$ASSET" && test "$ASSET" != "null" || { echo "::error::no suitable toolchain asset found (see list above)"; exit 1; }
          echo "Using asset: $ASSET"
          gh release download --repo OpenOrbis/PS4Toolchain-PS4-Toolchain --pattern "$ASSET" --dir /tmp/oo
          mkdir -p "$HOME/OpenOrbis" && cd "$HOME/OpenOrbis"
          case "$ASSET" in *.zip) unzip -q "/tmp/oo/$ASSET" ;; *) tar -xzf "/tmp/oo/$ASSET" ;; esac
          TC=$(dirname "$(find "$HOME/OpenOrbis" -name link.x -path '*' | head -n1)")
          TC=$(dirname "$TC")
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          chmod +x "$TC"/bin/linux/* || true
          ls "$TC" "$TC/bin/linux"
      - name: Build + validate PKG
        run: make
      - name: Verify PKG file
        run: |
          set -e
          PKG=$(ls IV0000-*.pkg)
          ls -l "$PKG"
          test "$(head -c4 "$PKG" | xxd -p)" = "7f434e54" || { echo "::error::bad PKG magic"; exit 1; }
          echo "PKG magic OK"
      - uses: actions/upload-artifact@v4
        with:
          name: DELUXE-PKG-MANAGER-pkg
          path: IV0000-*.pkg
          if-no-files-found: error

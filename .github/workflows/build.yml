name: Build DELUXE PS4

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar make unzip jq libtinfo5
          
      - name: Install LLVM 18
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}/llvm

      - name: Download OpenOrbis SDK
        shell: bash
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest"
          URL=$(curl -fsSL "$API" | jq -r '.assets[] | select(.name == "toolchain-llvm-18.tar.gz") | .browser_download_url')
          test -n "$URL"
          mkdir -p "$RUNNER_TEMP/OpenOrbisSDK"
          curl -fL "$URL" -o "$RUNNER_TEMP/openorbis.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/OpenOrbisSDK"
          SDK="$RUNNER_TEMP/OpenOrbisSDK/OpenOrbis/PS4Toolchain"
          test -f "$SDK/link.x"
          test -d "$SDK/include"
          test -d "$SDK/lib"
          echo "OO_PS4_TOOLCHAIN=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin/linux" >> "$GITHUB_PATH"
          echo "=== LLVM ==="
          clang --version
          ld.lld --version
          echo "=== SDK tools ==="
          ls -la "$SDK/bin/linux"
          echo "=== Packaging tool help ==="
          export OO_PS4_TOOLCHAIN="$SDK"
          "$SDK/bin/linux/create-fself" --help || true
          echo "=== OpenOrbis packaging README ==="
          cat "$SDK/bin/linux/README.md"
          "$SDK/bin/linux/create-gp4" --help || true
          echo "=== SFO / GP4 tools ==="
          find "$SDK/bin/linux" -maxdepth 1 -type f -printf '%f\\n' | sort

      - name: Inspect package tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$OO_PS4_TOOLCHAIN"
          echo "=== Available package tools ==="
          find "$SDK" -type f \\
            \( -iname '*pkg*' -o -iname '*sfo*' -o -iname '*eboot*' \) \\
            -print | sort
          echo "=== SDK packaging files ==="
          find "$SDK" -maxdepth 3 -type f \\
            \( -iname '*README*' -o -iname '*.dll' -o -iname '*.jar' \) \\
            -print | sort | head -100

      - name: Validate build setup
        run: |
          set -euxo pipefail
          test -f src/main.c
          test -f sce_sys/icon0.png
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          echo "SDK and source files are present."
          echo "A verified SFO/GP4 package recipe is still required before producing a PKG."
